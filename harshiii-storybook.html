<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>For Harshiii ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    :root {
      --h: min(74vh, 600px);
      --pw: min(calc(var(--h)*.74), 45vw);
      --serif: "Playfair Display", Georgia, serif;
      --script: "Dancing Script", "Segoe Script", cursive;
      --rose: #c05d7b;
      --ink: #6d5254;
      --gold: #e2bd83;
    }

    @media(max-width:720px) {
      :root {
        --h: min(76vh, 640px);
        --pw: min(90vw, calc(var(--h)*.74))
      }
    }

    html,
    body {
      height: 100%
    }

    body {
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 35%, #3b2146 0%, #1b1226 55%, #0a0812 100%);
      font-family: var(--serif);
      color: var(--ink);
    }

    #sky,
    #fx {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #fff;
      animation: tw 3s infinite alternate
    }

    @keyframes tw {
      from {
        opacity: .1;
        transform: scale(.6)
      }

      to {
        opacity: .9;
        transform: scale(1.5)
      }
    }

    .shoot {
      position: absolute;
      width: 110px;
      height: 2px;
      background: linear-gradient(90deg, #fff, transparent);
      transform: rotate(25deg);
      opacity: 0;
      animation: shoot 1.3s ease-out forwards
    }

    @keyframes shoot {
      0% {
        opacity: 1;
        translate: 0 0
      }

      100% {
        opacity: 0;
        translate: 320px 150px
      }
    }

    .fh {
      position: absolute;
      bottom: -30px;
      color: #ff9db7;
      animation: fl linear forwards
    }

    @keyframes fl {
      0% {
        transform: translateY(0) rotate(0);
        opacity: 0
      }

      15% {
        opacity: .7
      }

      100% {
        transform: translateY(-110vh) rotate(40deg);
        opacity: 0
      }
    }

    /* ---------- book ---------- */
    .stage {
      position: relative;
      z-index: 2;
      width: calc(var(--pw)*2);
      height: var(--h);
      perspective: 2600px
    }

    .book {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform 1.1s cubic-bezier(.6, .05, .25, 1);
      transform: translateX(calc(var(--pw)*-.5))
    }

    .book.open {
      transform: none
    }

    .book::before {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 10px;
      background: linear-gradient(#4d2540, #27121f);
      box-shadow: 0 35px 70px #000b;
      opacity: 0;
      transition: opacity .9s;
      transform: translateZ(-2px)
    }

    .book.open::before {
      opacity: 1
    }

    .leaf {
      position: absolute;
      top: 0;
      left: 50%;
      width: 50%;
      height: 100%;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 1.1s cubic-bezier(.6, .05, .25, 1)
    }

    .leaf.flipped {
      transform: rotateY(-180deg)
    }

    .face {
      position: absolute;
      inset: 0;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      font-size: calc(var(--pw)/26)
    }

    .paper {
      background:
        repeating-linear-gradient(0deg, transparent 0 1.9em, #9b796012 1.9em calc(1.9em + 1px)),
        linear-gradient(90deg, #e6d1b4 0, #fff3e2 6%, #fffaf1 100%)
    }

    .front {
      border-radius: 2px 10px 10px 2px
    }

    .back {
      transform: rotateY(180deg);
      border-radius: 10px 2px 2px 10px;
      background:
        repeating-linear-gradient(0deg, transparent 0 1.9em, #9b796012 1.9em calc(1.9em + 1px)),
        linear-gradient(270deg, #e6d1b4 0, #fff1de 6%, #fbeddb 100%)
    }

    .pg {
      position: absolute;
      inset: 0;
      padding: 2.3em 2em 2.6em;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center
    }

    h2 {
      font-weight: 500;
      font-size: 1.85em;
      line-height: 1.25;
      color: #9b4f66;
      margin-bottom: .4em
    }

    p {
      line-height: 1.8;
      color: var(--ink)
    }

    .orn {
      font-size: 1.9em;
      color: #d48b9e;
      margin-bottom: .35em
    }

    .rule {
      width: 4.5em;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c99b82, transparent);
      margin: .9em auto
    }

    .script {
      font-family: var(--script);
      font-size: 1.7em;
      color: var(--rose);
      line-height: 1.3
    }

    .glow {
      animation: glow 2.6s infinite alternate
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 4px #e9a3b422
      }

      to {
        text-shadow: 0 0 18px #e879a0aa
      }
    }

    .pn {
      position: absolute;
      bottom: 1em;
      right: 1.5em;
      font-size: .75em;
      color: #b89a83;
      font-style: italic
    }

    .rise {
      opacity: 0
    }

    .seen .rise {
      animation: rise .8s calc(var(--i)*.13s + .55s) both
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(14px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    /* left (back) pages */
    .back .pg {
      color: #8a6a6a
    }

    .back .big {
      position: absolute;
      font-size: 16em;
      color: #e9b8c455;
      line-height: 1;
      z-index: 0;
      pointer-events: none;
      bottom: -.15em;
      right: -.1em
    }

    .back .pg>* {
      position: relative;
      z-index: 1
    }

    .back h2 {
      font-style: italic;
      font-size: 1.55em
    }

    /* cover */
    .cover {
      background:
        radial-gradient(circle at 50% 38%, #6a2f55 0%, transparent 60%),
        linear-gradient(110deg, #25122a, #4f2540 50%, #2f1731);
      border: 2px solid #a77c56;
      box-shadow: inset 6px 0 14px #ffffff12, inset -6px 0 14px #0006;
      cursor: pointer;
      color: #f5dcc3
    }

    .cover::before {
      content: "";
      position: absolute;
      inset: .9em;
      border: 1px solid #e2bd8399;
      border-radius: 6px;
      box-shadow: inset 0 0 0 .35em transparent, inset 0 0 0 calc(.35em + 1px) #e2bd8344
    }

    .cover .pg {
      padding-left: 2.4em
    }

    .cover .spine {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 1.1em;
      background: repeating-linear-gradient(0deg, #c9a06c 0 .5em, #5a3345 .5em 1em);
      opacity: .55
    }

    .small {
      letter-spacing: .3em;
      font-size: .72em;
      color: #d9b98f;
      text-transform: uppercase;
      margin-bottom: 2.2em
    }

    .foil {
      font-family: var(--script);
      font-size: 4.2em;
      line-height: 1;
      background: linear-gradient(100deg, #b98d4f, #fff0c4 30%, #c99a58 50%, #fff0c4 70%, #b98d4f);
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: foil 4.5s linear infinite;
      filter: drop-shadow(0 0 14px #f6b9c455)
    }

    @keyframes foil {
      to {
        background-position: -250% 0
      }
    }

    .seal {
      font-size: 2.6em;
      margin: .5em 0;
      color: #ff7a9c;
      animation: beat 1.5s infinite;
      filter: drop-shadow(0 0 12px #ff7a9c)
    }

    @keyframes beat {

      0%,
      100% {
        transform: scale(1)
      }

      15% {
        transform: scale(1.22)
      }

      30% {
        transform: scale(1)
      }

      45% {
        transform: scale(1.14)
      }
    }

    .touch {
      position: absolute;
      bottom: 2.4em;
      left: 0;
      right: 0;
      text-align: center;
      font-size: .72em;
      letter-spacing: .3em;
      color: #e8c9a4;
      animation: br 2.2s infinite
    }

    @keyframes br {
      50% {
        opacity: .3
      }
    }

    /* counter */
    .count {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: .5em;
      width: 100%;
      margin: .6em 0
    }

    .count div {
      background: #f8e3e0;
      border-radius: 8px;
      padding: .7em .2em;
      box-shadow: inset 0 0 0 1px #e8bcc4
    }

    .count b {
      display: block;
      font-size: 1.6em;
      color: #a24f69;
      font-weight: 500;
      font-variant-numeric: tabular-nums
    }

    .count small {
      font-size: .7em;
      color: #9c7c76;
      font-style: italic
    }

    /* timeline */
    .tl {
      width: 100%;
      text-align: left;
      margin-top: .5em
    }

    .tl div {
      border-left: 2px solid #d9a2a9;
      padding: 0 0 1em 1.1em;
      margin-left: .6em;
      position: relative
    }

    .tl div::before {
      content: "♥";
      position: absolute;
      left: -.62em;
      top: -.1em;
      font-size: .9em;
      color: #cf8194;
      background: #fff8ee
    }

    .tl b {
      display: block;
      color: #a55f70;
      font-weight: 500;
      font-size: 1.05em
    }

    .tl span {
      font-size: .88em;
      color: #816767;
      line-height: 1.5
    }

    /* polaroids */
    .gal {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1em;
      width: 100%;
      margin-top: .6em
    }

    .pol {
      background: #fff;
      padding: .45em .45em .3em;
      box-shadow: 0 4px 12px #6a4b3d40;
      transform: rotate(var(--r));
      transition: transform .35s;
      cursor: zoom-in
    }

    .pol:hover {
      transform: rotate(0) scale(1.06)
    }

    .ph {
      aspect-ratio: 1;
      background: linear-gradient(135deg, #f7dfd6, #efc9d3);
      display: grid;
      place-items: center;
      overflow: hidden;
      font-size: .8em;
      color: #a7877e
    }

    .ph img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .pol em {
      display: block;
      font-family: var(--script);
      font-style: normal;
      font-size: 1.15em;
      color: #9b4f66;
      margin-top: .15em
    }

    /* reasons */
    .rs {
      display: grid;
      gap: .55em;
      width: 100%;
      margin-top: .5em
    }

    .rs button {
      font: inherit;
      font-size: .92em;
      padding: .75em .9em;
      border: 1px dashed #d9a2a9;
      background: #fbe9e6;
      color: #a05a6c;
      border-radius: 8px;
      cursor: pointer;
      transition: all .35s
    }

    .rs button.on {
      background: #f6d5db;
      border-style: solid;
      color: #7a3a50
    }

    .hint {
      font-size: .78em;
      font-style: italic;
      color: #b08a83;
      margin-top: .7em
    }

    /* finale */
    .ask {
      font-family: var(--script);
      font-size: 2.3em;
      color: var(--rose);
      line-height: 1.2;
      margin: .1em 0 .4em
    }

    .btns {
      display: flex;
      gap: 1em;
      align-items: center;
      justify-content: center;
      height: 4em;
      position: relative
    }

    .btns button {
      font: inherit;
      font-size: 1em;
      border: none;
      border-radius: 99px;
      padding: .7em 1.6em;
      cursor: pointer
    }

    #yes {
      background: linear-gradient(135deg, #ef7c9a, #c4476f);
      color: #fff;
      box-shadow: 0 6px 18px #c4476f66;
      transition: transform .3s
    }

    #yes:hover {
      transform: scale(1.08)
    }

    #no {
      background: #efe2d6;
      color: #8a6a6a;
      transition: transform .35s cubic-bezier(.3, 1.6, .5, 1)
    }

    /* controls */
    .ctl {
      position: relative;
      z-index: 3;
      margin-top: 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .8s .6s
    }

    .ctl.on {
      opacity: 1;
      pointer-events: auto
    }

    .ctl button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid #e2bd8388;
      background: #ffffff10;
      color: var(--gold);
      font-size: 18px;
      cursor: pointer;
      transition: .25s
    }

    .ctl button:hover:not(:disabled) {
      background: #ffffff26
    }

    .ctl button:disabled {
      opacity: .25;
      cursor: default
    }

    .dots {
      display: flex;
      gap: 8px
    }

    .dots i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ffffff33;
      transition: .4s
    }

    .dots i.on {
      background: var(--gold);
      transform: scale(1.4)
    }

    button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px
    }

    .lb {
      position: fixed;
      inset: 0;
      background: #090711ee;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px
    }

    .lb.show {
      display: flex
    }

    .lb img {
      max-width: 92vw;
      max-height: 86vh;
      border: 10px solid #fff8ed;
      box-shadow: 0 0 40px #000
    }

    @media(max-width:720px) {
      .stage {
        width: var(--pw)
      }

      .book,
      .book.open {
        transform: none
      }

      .book::before {
        display: none
      }

      .leaf {
        left: 0;
        width: 100%
      }

      .face {
        border-radius: 10px
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation-duration: .01s !important;
        transition-duration: .01s !important
      }
    }
  </style>
</head>

<body>
  <div id="sky"></div>
  <div id="fx"></div>

  <div class="stage">
    <div class="book" id="book"></div>
  </div>

  <div class="ctl" id="ctl">
    <button id="prev" aria-label="Previous page">‹</button>
    <div class="dots" id="dots"></div>
    <button id="next" aria-label="Next page">›</button>
  </div>

  <div class="lb" id="lb"><img id="lbImg" alt="Our memory"></div>

  <script>
    /* =========================================================
       EDIT YOUR STORY HERE
    ========================================================= */
    const CONFIG = {
      her: "Harshiii",
      pet: "Thangapilla",
      him: "Ram Praveen",
      start: new Date(2026, 6, 24),          // 24 July 2026 (month is 0-based)
      milestone: "24 November 2026",
      timeline: [
        { t: "The Beginning", d: "The day our story started." },
        { t: "Getting Closer", d: "Every conversation brought us nearer." },
        { t: "Beautiful Memories", d: "Little moments turned into treasures." },
        { t: "Four Months Together", d: "And I still feel lucky to have you." }
      ],
      photos: [
        { src: "images/memory1.jpeg", cap: "Us ♡", r: -3 },
        { src: "images/memory2.jpeg", cap: "That smile", r: 2.5 },
        { src: "images/memory3.jpeg", cap: "My favourite day", r: 2 },
        { src: "images/memory4.jpeg", cap: "Always you", r: -2.5 }
      ],
      reasons: [
        "Your beautiful smile",
        "The happiness you bring into my life",
        "The way you make ordinary days special",
        "Your little habits and silly moments",
        "How I feel at home when we talk",
        "Simply being you, " + "Harshiii"
      ]
    };

    /* =========================================================
       PAGES  (index 0 = cover)
    ========================================================= */
    const C = CONFIG;
    const right = [
      `<div class="spine"></div>
 <div class="pg">
  <div class="small">A story made with love</div>
  <div class="foil">For ${C.her}</div>
  <div class="seal">♥</div>
  <p style="color:#e6c5b7;letter-spacing:.12em;line-height:1.9">Our Little Universe<br>Four Months of Us</p>
  <div class="touch">TOUCH TO OPEN</div>
 </div>`,

      `<div class="orn">♡</div>
 <h2>Dear <span class="script glow" style="font-size:1.25em">${C.her}</span>,</h2>
 <div class="rule"></div>
 <p>If I could choose one beautiful thing to happen in my life again and again, I would choose meeting you.</p><br>
 <p>This little book is not only about four months. It is about the happiness you brought into my life.</p>
 <div class="pn">1</div>`,

      `<div class="orn">✿</div>
 <h2>Four Months of Us</h2>
 <p>Every second since 24 July has been a gift. Here is the proof, still ticking:</p>
 <div class="count" id="count">
   <div><b data-u="d">0</b><small>days</small></div><div><b data-u="h">0</b><small>hours</small></div>
   <div><b data-u="m">0</b><small>minutes</small></div><div><b data-u="s">0</b><small>seconds</small></div>
 </div>
 <div class="rule"></div>
 <p class="script">${C.milestone}</p>
 <p style="font-size:.9em">Our beautiful four-month milestone ❤️</p>
 <div class="pn">2</div>`,

      `<div class="orn">❀</div>
 <h2>Our Little Timeline</h2>
 <div class="tl">${C.timeline.map(x => `<div><b>${x.t}</b><span>${x.d}</span></div>`).join("")}</div>
 <div class="pn">3</div>`,

      `<div class="orn">✦</div>
 <h2>Our Memories</h2>
 <p style="font-size:.92em">Some moments deserve to stay forever. Tap a photo to see it bigger.</p>
 <div class="gal">${C.photos.map(p => `<div class="pol" style="--r:${p.r}deg" data-src="${p.src}">
   <div class="ph"><img src="${p.src}" alt="" onerror="this.remove()">📷</div><em>${p.cap}</em></div>`).join("")}</div>
 <div class="pn">4</div>`,

      `<div class="orn">♡</div>
 <h2>Why You're Special</h2>
 <p style="font-size:.92em">So many little things. Tap each one to open it.</p>
 <div class="rs">${C.reasons.map((r, i) => `<button data-r="${r}">♡ Reason ${i + 1}</button>`).join("")}</div>
 <div class="pn">5</div>`,

      `<div class="orn">💌</div>
 <h2>A Little Message</h2>
 <p>My dear <span class="script glow">${C.pet}</span>,</p>
 <p style="margin-top:.6em">I may not be perfect, and I may not always find the right words. But one thing I know: I want us to stay together and make countless beautiful memories.</p>
 <p style="margin-top:.6em">Thank you for being part of my life.</p>
 <div class="rule"></div>
 <p style="font-size:.9em">With lots of love,</p>
 <p class="script" style="font-size:2em">${C.him}</p>
 <div class="pn">6</div>`,

      `<div id="finale" style="display:contents">
 <div class="orn" style="font-size:2.4em">♥</div>
 <h2>One Last Question…</h2>
 <p>${C.her}, these four months are only the beginning. I don't know what the future holds, but I know I want to share it with you.</p>
 <div class="ask glow">Will you stay with me forever?</div>
 <div class="btns"><button id="yes">Yes, always ❤️</button><button id="no">Not yet</button></div>
 </div><div class="pn">7</div>`
    ];

    const left = [
      { i: "❀", h: "Some stories are written in books. Ours is written in my heart.", p: "Every page holds a little memory.<br>Every memory holds a little piece of you." },
      { i: "✦", h: "Every second with you counts.", p: "Time feels different when it is spent with someone who makes you smile." },
      { i: "☾", h: "Little moments, big feelings.", p: "The ordinary days with you are the ones I would pick again." },
      { i: "♡", h: "Pictures freeze a moment.", p: "You are what makes the moment worth keeping." },
      { i: "✿", h: "If I listed everything I love, this book would never end.", p: "So I chose six. The rest I save for later." },
      { i: "✉", h: "Words are small.", p: "But I hope they carry all of what I feel." },
      { i: "♥", h: "And now… the last page.", p: "Whatever you answer, thank you for the best four months." }
    ];

    /* =========================================================
       BUILD BOOK
    ========================================================= */
    const book = document.getElementById("book");
    const N = right.length;
    const leaves = right.map((html, i) => {
      const L = document.createElement("div");
      L.className = "leaf";
      const lf = left[i];
      L.innerHTML = `
    <div class="face front ${i === 0 ? "cover" : "paper"}"><div class="${i === 0 ? "" : "pg"}" ${i === 0 ? 'style="position:absolute;inset:0"' : ""}>${html}</div></div>
    <div class="face back">${lf ? `<div class="pg"><div class="big">${lf.i}</div><div class="orn">${lf.i}</div><h2>${lf.h}</h2><div class="rule"></div><p style="font-size:.95em">${lf.p}</p></div>` : ""}</div>`;
      L.style.zIndex = N - i;
      if (i > 0) L.querySelectorAll(".front .pg > *:not(.pn)").forEach((e, n) => { e.classList.add("rise"); e.style.setProperty("--i", n); });
      book.appendChild(L);
      return L;
    });
    leaves[0].querySelector(".front").addEventListener("click", () => go(1));

    /* dots */
    const dots = document.getElementById("dots");
    for (let i = 1; i < N; i++) dots.appendChild(document.createElement("i"));

    /* =========================================================
       PAGE-TURN ENGINE
    ========================================================= */
    let k = 0, busy = false;
    const prev = document.getElementById("prev"), next = document.getElementById("next"), ctl = document.getElementById("ctl");

    function go(d) {
      if (busy) return;
      const n = k + d;
      if (n < 0 || n > N - 1) return;
      busy = true;
      if (d > 0) {
        leaves[k].classList.add("flipped");
        const idx = k;
        setTimeout(() => leaves[idx].style.zIndex = idx, 550);
      } else {
        leaves[n].style.zIndex = N - n;
        leaves[n].classList.remove("flipped");
      }
      k = n;
      leaves[k].classList.add("seen");
      book.classList.toggle("open", k > 0);
      ctl.classList.toggle("on", k > 0);
      prev.disabled = k === 0;
      next.disabled = k === N - 1;
      [...dots.children].forEach((x, i) => x.classList.toggle("on", i === k - 1));
      setTimeout(() => busy = false, 900);
    }
    prev.onclick = () => go(-1);
    next.onclick = () => go(1);
    document.addEventListener("keydown", e => {
      if (e.key === "ArrowRight" || e.key === "Enter" && k === 0) go(1);
      if (e.key === "ArrowLeft") go(-1);
    });
    let sx = 0, sy = 0;
    document.addEventListener("touchstart", e => { sx = e.changedTouches[0].clientX; sy = e.changedTouches[0].clientY }, { passive: true });
    document.addEventListener("touchend", e => {
      const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
    }, { passive: true });

    /* =========================================================
       PAGE FEATURES
    ========================================================= */
    /* live counter */
    const cEl = document.getElementById("count");
    function tick() {
      let s = Math.max(0, Math.floor((Date.now() - C.start) / 1000));
      const v = { d: Math.floor(s / 86400), h: Math.floor(s % 86400 / 3600), m: Math.floor(s % 3600 / 60), s: s % 60 };
      for (const u in v) cEl.querySelector(`[data-u=${u}]`).textContent = v[u];
    }
    tick(); setInterval(tick, 1000);

    /* reasons */
    document.querySelectorAll(".rs button").forEach(b => b.onclick = () => {
      b.classList.add("on"); b.textContent = "♥ " + b.dataset.r;
    });

    /* photos */
    const lb = document.getElementById("lb"), lbImg = document.getElementById("lbImg");
    document.querySelectorAll(".pol").forEach(p => p.onclick = () => {
      const img = p.querySelector("img");
      if (!img) return;
      lbImg.src = img.src; lb.classList.add("show");
    });
    lb.onclick = () => lb.classList.remove("show");

    /* finale */
    const fx = document.getElementById("fx");
    function burst(n) {
      const em = ["❤️", "💖", "💕", "✨", "🌸", "💗"];
      for (let i = 0; i < n; i++) {
        const e = document.createElement("span");
        e.textContent = em[i % em.length];
        e.style.cssText = `position:absolute;left:50%;top:55%;font-size:${14 + Math.random() * 22}px`;
        fx.appendChild(e);
        const a = Math.random() * Math.PI * 2, r = 120 + Math.random() * 420;
        e.animate([
          { transform: "translate(-50%,-50%) scale(.3)", opacity: 1 },
          { transform: `translate(calc(-50% + ${Math.cos(a) * r}px),calc(-50% + ${Math.sin(a) * r - 60}px)) rotate(${Math.random() * 360}deg)`, opacity: 1, offset: .6 },
          { transform: `translate(calc(-50% + ${Math.cos(a) * r}px),calc(-50% + ${Math.sin(a) * r + 260}px)) rotate(${Math.random() * 540}deg)`, opacity: 0 }
        ], { duration: 2200 + Math.random() * 1500, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => e.remove();
      }
    }
    const yes = document.getElementById("yes"), no = document.getElementById("no");
    const nos = ["Not yet", "Are you sure? 🥺", "Think again…", "Wrong button!", "Just press Yes 😌"];
    let tries = 0;
    function dodge(e) {
      e.preventDefault();
      tries++;
      no.textContent = nos[Math.min(tries, nos.length - 1)];
      no.style.transform = `translate(${(Math.random() - .5) * 120}px,${(Math.random() - .5) * 90}px)`;
      yes.style.fontSize = (1 + Math.min(tries, 6) * .1) + "em";
    }
    no.addEventListener("pointerenter", dodge);
    no.addEventListener("click", dodge);
    yes.onclick = () => {
      document.getElementById("finale").innerHTML = `
    <div class="orn" style="font-size:3em;animation:beat 1.3s infinite">❤️</div>
    <h2>She said yes!</h2>
    <div class="rule"></div>
    <p class="script" style="font-size:2em">${C.pet},</p>
    <p>You just made me the happiest person in the world. Here's to forever, one beautiful memory at a time.</p>
    <p class="script" style="margin-top:.6em">Happy 4 Months, my love ❤️</p>
    <p style="font-size:.9em;margin-top:.2em">Forever yours, ${C.him}</p>`;
      burst(70);
      const t = setInterval(() => burst(12), 700);
      setTimeout(() => clearInterval(t), 6000);
    };

    /* =========================================================
       BACKGROUND
    ========================================================= */
    const sky = document.getElementById("sky");
    for (let i = 0; i < 90; i++) {
      const s = document.createElement("div");
      s.className = "star";
      s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;animation-delay:${Math.random() * 4}s;animation-duration:${2 + Math.random() * 4}s`;
      sky.appendChild(s);
    }
    setInterval(() => {
      const s = document.createElement("div");
      s.className = "shoot";
      s.style.cssText = `left:${Math.random() * 60}%;top:${Math.random() * 40}%`;
      sky.appendChild(s);
      setTimeout(() => s.remove(), 1400);
    }, 5000);
    setInterval(() => {
      const h = document.createElement("div");
      h.className = "fh";
      h.textContent = Math.random() > .5 ? "♥" : "♡";
      h.style.cssText = `left:${Math.random() * 100}vw;font-size:${12 + Math.random() * 18}px;animation-duration:${7 + Math.random() * 7}s`;
      sky.appendChild(h);
      setTimeout(() => h.remove(), 14000);
    }, 1100);
  </script>
</body>

</html>
